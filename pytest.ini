[pytest]
# Phase 11.5: put the repo root on sys.path so `import app` works under the plain `pytest` command too
# (CI runs it that way; `python -m pytest` only worked because it adds the current directory itself).
pythonpath = .
# Phase 11.2 (D-039): plain `pytest` stays offline. Tests that need the real Neon database or Gemini
# (and a filled-in .env) are marked `live` and run only on request: `pytest -m live`.
markers =
    live: needs the real Neon database and/or Gemini API; excluded by default, run with `pytest -m live`
addopts = -m "not live"
