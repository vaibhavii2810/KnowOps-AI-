# Phase 11.5 (D-041): run the offline test suite on every push and pull request.
# No secrets are configured on purpose: plain `pytest` must pass with no .env, no database and no
# Gemini key (tests marked `live` are excluded by pytest.ini, and tests/conftest.py fakes the rest).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # 3.11 = the team's local venv, 3.12 = Vercel's Python runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: tests/test_secrets_hygiene.py scans every commit, not just the tip

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (offline; live tests excluded by pytest.ini)
        run: pytest -ra
